<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가로 흔들림 임시 점검</title>
<style>
body{font:13px/1.5 -apple-system,sans-serif;padding:16px}
#out{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}
iframe{position:fixed;left:-9999px;top:0;visibility:hidden}
</style>
</head>
<body>
<h1>임시 점검 페이지</h1>
<div id="out">loading…</div>
<script>
const TOOLS = ['2027-holidays','yeoncha-2027','chukuigeum','sangjang','bingo-2027','arubaito-kabe','mulga','omikuji','payday','jireum','deokjil'];
const WIDTHS = [293, 308, 375];
const out = document.getElementById('out');
const lines = [];

function load(url, width){
  return new Promise(resolve => {
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.style.height = '900px';
    f.src = url;
    f.onload = () => setTimeout(() => {
      const d = f.contentDocument, w = f.contentWindow;
      const cw = d.documentElement.clientWidth;
      const guardHtmlSW = d.documentElement.scrollWidth;
      const guardBodySW = d.body.scrollWidth;
      // 보호 규칙(overflow-x:clip, max-width)을 끄고 실제 내용 폭을 잰다 = 잘려서 안 보이는 내용이 있는지 확인
      const s = d.createElement('style');
      s.textContent = 'html,body{overflow-x:visible!important;max-width:none!important}';
      d.head.appendChild(s);
      void d.body.offsetWidth;
      const naturalSW = d.documentElement.scrollWidth;
      s.remove();
      // 수정 전 상태 재현: body{min-width:320px}를 다시 넣고 문서 폭이 얼마나 넘치는지
      const s2 = d.createElement('style');
      s2.textContent = 'body{min-width:320px!important;overflow-x:visible!important}html{overflow-x:visible!important;max-width:none!important}html,body{max-width:none!important}';
      d.head.appendChild(s2);
      void d.body.offsetWidth;
      const oldSW = d.documentElement.scrollWidth;
      s2.remove();
      resolve({width, cw, guardHtmlSW, guardBodySW, naturalSW, oldSW});
    }, 900);
    document.body.appendChild(f);
  });
}

(async () => {
  for (const t of TOOLS){
    for (const w of WIDTHS){
      const r = await load('/' + t + '/?embed=1', w);
      const overflow = Math.max(r.guardHtmlSW, r.guardBodySW) > r.cw;
      const clipped = r.naturalSW > r.cw;
      lines.push((overflow || clipped ? '❌ ' : '✅ ') + t + ' @' + w + 'px  clientW=' + r.cw +
        ' scrollW=' + Math.max(r.guardHtmlSW, r.guardBodySW) +
        ' 자연폭(보호끄면)=' + r.naturalSW + (clipped ? '  ⚠ ' + (r.naturalSW - r.cw) + 'px 잘림' : '') +
        ' | 수정전(min-width:320) 재현=' + r.oldSW + (r.oldSW > r.cw ? ' → ' + (r.oldSW - r.cw) + 'px 넘침' : ''));
    }
  }
  out.textContent = lines.join('\n');
  document.title = 'DONE';
})();
</script>
</body>
</html>
